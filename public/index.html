<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SmartStudy Assistant</title>
<meta name="description" content="Explain a topic, take the exam, get your weak spots diagnosed and filed for spaced review." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="desk">
    <header class="topbar">
      <div>
        <span class="wordmark">SmartStudy</span><br />
        <span class="tagline">filed for later, reviewed on time</span>
      </div>
      <div class="topbar-right">
        <button class="nav-tab" data-action="go-recall" id="recall-nav-tab">
          Review queue<span class="badge visually-hidden" id="due-badge" hidden>0</span>
        </button>
      </div>
    </header>
    <main id="app" aria-live="polite"></main>
  </div>
  <script src="/script.js"></script>
</body>
</html>
