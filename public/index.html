  />

<body>

        <div class="brand-mark" aria-hidden="true">S</div>

  <!-- Firebase Auth Initialization (Loads credentials dynamically from /api/config/firebase) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    window.FirebaseAuth = {
      isReady: false,
      currentUser: null,
      auth: null,
      callbacks: [],
      init: async function () {
        try {
          const res = await fetch("/api/config/firebase");
          if (!res.ok) {
            console.error("Failed to fetch /api/config/firebase — ensure server.js from branch IMRAN-8-p2_v8.08 is deployed.");
            return;
          }
          const config = await res.json();
          if (!config.apiKey) {
            console.error("Firebase config not found on server. Check FIREBASE_API_KEY in Render Environment.");
            return;
          }
          const app = initializeApp(config);
          this.auth = getAuth(app);
          const provider = new GoogleAuthProvider();
          provider.setCustomParameters({ prompt: "select_account" });

          this.signIn = () => signInWithPopup(this.auth, provider);
          this.signOut = () => signOut(this.auth);
          this.getToken = async () => {
            if (!this.auth || !this.auth.currentUser) return null;
            return await this.auth.currentUser.getIdToken();
          };

          onAuthStateChanged(this.auth, (user) => {
            this.currentUser = user;
            this.callbacks.forEach((cb) => cb(user));
          });

          this.isReady = true;
          window.dispatchEvent(new CustomEvent("firebase-ready"));
        } catch (err) {
          console.error("Failed to initialize Firebase Auth:", err);
        }
      },
      onAuthStateChanged: function (callback) {
        this.callbacks.push(callback);
        if (this.isReady && this.auth) {
          callback(this.auth.currentUser);
        }
      }
    };

    window.FirebaseAuth.init();
  </script>

  <!-- Main App Script -->
  <script src="script.js"></script>
</body>
</html>
