<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SmartStudy Assistant</title>
<meta name="description" content="Explain a topic, take the exam, get your weak spots diagnosed and filed for spaced review." />
<meta name="theme-color" content="#070A14" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%237C6CF0'/><path d='M9 21V11l7 5 7-5v10' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
</head>
<body>

  <!-- Ambient backdrop: drifting light + a faint technical grid. Purely
       decorative, and switched off under prefers-reduced-motion. -->
  <div class="backdrop" aria-hidden="true">
    <span class="aurora aurora-1"></span>
    <span class="aurora aurora-2"></span>
    <span class="aurora aurora-3"></span>
    <span class="grid-veil"></span>
    <span class="vignette"></span>
  </div>

  <div class="shell">
    <header class="topbar">
      <button class="brand" data-action="nav-home" aria-label="SmartStudy home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 8.5 12 4l9 4.5-9 4.5-9-4.5Z"/>
            <path d="M7 11v5.2c0 .6.3 1.1.9 1.4 1.2.6 2.7 1 4.1 1s2.9-.4 4.1-1c.6-.3.9-.8.9-1.4V11"/>
          </svg>
        </span>
        <span class="brand-text">
          <span class="wordmark">SmartStudy</span>
          <span class="tagline">diagnosed · re-taught · retained</span>
        </span>
      </button>

      <nav class="nav" id="main-nav" aria-label="Main navigation" hidden>
        <button class="nav-tab" data-action="nav-home" data-nav="home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M9 21v-7h6v7"/></svg>
          <span>Home</span>
        </button>
        <button class="nav-tab" data-action="nav-review" data-nav="recall">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
          <span>Review</span>
          <span class="badge" id="due-badge" hidden>0</span>
        </button>
        <button class="nav-tab" data-action="nav-history" data-nav="history">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h10"/></svg>
          <span>History</span>
        </button>
      </nav>

      <div class="user-area" id="user-area"></div>
    </header>

    <main id="app" aria-live="polite"></main>

    <footer class="footer">
      <span>SmartStudy Assistant</span>
      <span class="dot" aria-hidden="true">•</span>
      <span>explain → examine → diagnose → re-teach → recall</span>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
